<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        Student Component
      </mat-card-title>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
      <mat-form-field appearance="outline">
         <mat-label>Search...</mat-label>
      <input matInput (change)="filterStudents($event)">
      </mat-form-field>

      <table matSort mat-table [dataSource]="dataSource" class="mat-elevation-z1">

        <ng-container matColumnDef="id">
          <th mat-header-cell mat-sort-header *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let student"> {{student.id}} </td>
        </ng-container>

        <ng-container matColumnDef="firstName">
          <th mat-header-cell mat-sort-header *matHeaderCellDef> FirstName </th>
          <td mat-cell *matCellDef="let student"> {{student.firstname}} </td>
        </ng-container>

        <ng-container matColumnDef="lastName">
          <th mat-header-cell mat-sort-header *matHeaderCellDef> LastName </th>
          <td mat-cell *matCellDef="let student"> {{student.lastName}} </td>
        </ng-container>

        <ng-container matColumnDef="payments">
          <th mat-header-cell *matHeaderCellDef> Payments </th>
          <td mat-cell *matCellDef="let student"> <button mat-raised-button color="primary"  (click)="gotoPayments(student)" >payments</button> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
        <mat-paginator [pageSizeOptions]="[2, 5, 10, 20, 30, 50, 100, 200 ]"
                       showFirstLastButtons  aria-label="Select page of periodic elements">
        </mat-paginator>

    </mat-card-content>
  </mat-card>
</div>
